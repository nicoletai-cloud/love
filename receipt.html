<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電子收據｜好好禮車</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="電子收據｜好好禮車">
<meta property="og:description" content="好好禮車機場接送電子收據">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+JP:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f5f0;--fg:#2f2a24;--muted:#7a7066;--line:#e4dbce;--accent:#8a6d43;--accent-ink:#fff;--surface:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a17;--fg:#f1ebe3;--muted:#b3a899;--line:#3b352e;--accent:#c9a46b;--accent-ink:#1d1a17;--surface:#26221e}}
:root[data-theme="dark"]{--bg:#1d1a17;--fg:#f1ebe3;--muted:#b3a899;--line:#3b352e;--accent:#c9a46b;--accent-ink:#1d1a17;--surface:#26221e}
*{box-sizing:border-box}
html{font-size:18px}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px calc(32px + env(safe-area-inset-bottom))}
.langs{display:flex;justify-content:flex-end;gap:6px;margin-bottom:12px}
.langs button{font:inherit;font-size:.75rem;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;min-height:34px;cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
#receiptCard{width:100%;background:#FFFFFF;color:#2B241C;border-radius:6px;padding:34px 30px 28px;box-shadow:0 2px 5px rgba(0,0,0,.07),0 18px 34px -20px rgba(0,0,0,.35);--font-serif:"Noto Serif TC",serif;--font-sans:"Noto Sans TC",sans-serif;font-family:var(--font-sans)}
#receiptCard.lang-ja{--font-serif:"Noto Serif JP",serif;--font-sans:"Noto Sans JP",sans-serif}
.r-head{text-align:center;margin-bottom:14px}
.r-head img{width:56px;height:56px;border-radius:50%;margin-bottom:8px}
.r-head .brand{font-family:var(--font-serif);font-size:1.3rem;font-weight:700;letter-spacing:.06em;color:#3A2E17}
.r-head .phone{font-size:.74rem;color:#6B5B42;margin-top:3px;letter-spacing:.02em}
.r-rule{height:1px;background:linear-gradient(90deg,transparent,#C9A15E,transparent);margin:16px 0}
.r-title-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.r-title{font-family:var(--font-serif);font-size:1.05rem;font-weight:600;letter-spacing:.16em;color:#3A2E17;flex-shrink:0}
.r-meta{text-align:right;font-size:.72rem;color:#6B5B42;line-height:1.6}
.r-meta b{color:#4A3D26;font-weight:600}
.r-line{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px dashed #E6DAC1;font-size:.85rem}
.r-line:last-child{border-bottom:none}
.r-line .k{color:#6B5B42;flex-shrink:0}
.r-line .v{color:#2B241C;text-align:right;font-weight:500}
.r-trips{margin:2px 0 4px;border-top:1px dashed #E6DAC1}
.r-trip-item{padding:9px 0;border-bottom:1px dashed #E6DAC1}
.r-trip-item:last-child{border-bottom:none}
.r-trip-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.72rem;color:#6B5B42;margin-bottom:3px}
.r-trip-top .lbl{color:#856A3D;font-weight:700;letter-spacing:.03em}
.r-trip-top .amt{font-weight:700;color:#3A2E17;font-size:.85rem}
.r-trip-route{font-size:.85rem;color:#2B241C;font-weight:500}
.r-trip-route .arrow{color:#C9A15E;margin:0 6px}
.r-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding-top:14px;border-top:1px solid #E6DAC1}
.r-total .k{font-family:var(--font-serif);font-size:.95rem;color:#3A2E17;font-weight:600}
.r-total .v{font-family:var(--font-serif);font-size:1.5rem;font-weight:700;color:#8A5F2C}
.r-foot{margin-top:22px;text-align:center;font-size:.72rem;color:#7A6D52;letter-spacing:.03em;line-height:1.6}
.r-foot .thanks{font-family:var(--font-serif);font-size:.86rem;color:#6B5738;margin-bottom:4px}
.num{font-variant-numeric:tabular-nums}
.actions{display:flex;gap:10px;margin-top:18px}
.actions button{flex:1;font:inherit;font-size:.85rem;font-weight:600;border-radius:12px;min-height:48px;cursor:pointer;border:1px solid var(--accent)}
.actions .pri{background:var(--accent);color:var(--accent-ink)}
.actions .sec{background:transparent;color:var(--accent)}
.hint{font-size:.72rem;color:var(--muted);text-align:center;margin:12px 0 0;line-height:1.6}
.msg{text-align:center;color:var(--muted);padding:60px 10px;font-size:.9rem;line-height:1.8}
@media (max-width:380px){#receiptCard{padding:28px 20px 24px}}
@media print{.langs,.actions,.hint{display:none}body{background:#fff}#receiptCard{box-shadow:none}}
</style>
</head>

<script>/* 2026-10-17 中英文、數字與中文之間自動加空格（畫面＋複製的文字）；輸入框、網址不動 */
