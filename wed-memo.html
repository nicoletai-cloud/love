<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>禮車服務確認單｜好好禮車</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="禮車服務確認單｜好好禮車">
<meta property="og:description" content="請核對婚禮用車內容，並選擇尾款付款方式。">
<style>
:root{--bg:#f8f5f0;--surface:#fff;--fg:#2f2a24;--muted:#7a7066;--line:#e4dbce;--accent:#8a6d43;--accent-ink:#fff;--soft:#f3ece2;--warn:#b4532a;--warn-soft:#fbeee6;--ok:#2f7d4f;--ok-soft:#e8f4ec}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a17;--surface:#26221e;--fg:#f1ebe3;--muted:#b3a899;--line:#3b352e;--accent:#c9a46b;--accent-ink:#1d1a17;--soft:#2e2924;--warn:#f0a07a;--warn-soft:#3a2a22;--ok:#7fc79a;--ok-soft:#1f3328}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px calc(36px + env(safe-area-inset-bottom))}
.brand{color:var(--accent);font-weight:700;letter-spacing:.08em;font-size:14px}
h1{font-size:24px;margin:4px 0 8px}
h2{font-size:19px;margin:0 0 10px}
.lead{color:var(--muted);font-size:15px;margin:0 0 12px;white-space:pre-line}
.load{color:var(--muted);padding:30px 0;text-align:center;white-space:pre-line}
.memo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;white-space:pre-wrap;word-break:break-word;font-size:15.5px;line-height:1.75}
.side{display:grid;gap:14px;align-content:start}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:2px;display:flex;align-items:center;justify-content:center}
.opt[aria-pressed="true"] .dot{border-color:var(--accent)}
.opt[aria-pressed="true"] .dot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent)}
.opt b{display:block;font-size:17px}
.opt span{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.opt .amt{color:var(--accent);font-weight:700;font-size:20px;margin-top:4px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:15.5px;font-weight:600}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:16px;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.chk input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.err{color:var(--warn);font-size:14.5px;margin:4px 0 0;min-height:0}
button.go{font:inherit;font-weight:700;font-size:18px;color:var(--accent-ink);background:var(--accent);border:0;border-radius:12px;min-height:54px;width:100%;cursor:pointer}
button.go:disabled{opacity:.6}
.ghost{font:inherit;font-size:15.5px;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:12px;min-height:46px;width:100%;cursor:pointer}
textarea{font:inherit;font-size:16px;width:100%;min-height:96px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--fg)}
.done{text-align:center;padding:28px 0 8px}
.done .ck{width:84px;height:84px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:40px}
.done h2{font-size:24px;margin:6px 0 8px}
.done p{color:var(--muted);margin:0 0 6px;white-space:pre-line}
.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:6px 14px;font-weight:600;margin:6px 0 14px}
a.line{display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;border-radius:12px;min-height:54px;margin-top:16px}
.prev{font-size:14.5px;color:var(--muted);text-align:center;margin-top:10px}
/* iPhone Duo 打開（寬螢幕）：左邊確認單、右邊付款與確認 */
@media (min-width:720px){.wrap{max-width:1000px;padding:28px 24px 40px}.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}.side{position:sticky;top:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">好好禮車 NICE WEDDING CAR</div>
  <h1>禮車服務確認單</h1>
  <div id="loading" class="load">讀取確認單中…</div>
  <div id="bad" class="load" hidden></div>

  <div id="main" hidden>
    <p class="lead" id="head"></p>
    <div class="grid">
      <div>
        <p class="lead" style="margin-bottom:8px">請核對下面所有內容（日期、時間、地點、車輛、聯絡人）是否正確：</p>
        <div class="memo" id="memo"></div>
      </div>
      <div class="side">
        <div id="payBox">
          <h2>尾款付款方式</h2>
          <div style="display:grid;gap:10px">
            <button type="button" class="opt" data-pay="cash" aria-pressed="false"><i class="dot"></i><div><b>用車當天付現金</b><span>尾款＋司機禮請包成一包，當天交給車隊負責人</span><div class="amt" id="amtCash"></div></div></button>
            <button type="button" class="opt" data-pay="transfer" aria-pressed="false"><i class="dot"></i><div><b>提前匯款</b><span>最晚在用車前一天匯款完成，匯款資訊在確認單的「付款」段落</span><div class="amt" id="amtXfer"></div></div></button>
          </div>
          <div class="warnbox" style="margin-top:12px">⚠️ 因會計無法即時對帳，請勿於用車當天匯款。</div>
        </div>
        <label class="chk"><input type="checkbox" id="okChk"><span>我已核對確認單的所有內容，皆正確無誤</span></label>
        <div class="err" id="err"></div>
        <button class="go" id="go" type="button">確認送出</button>
        <button class="ghost" id="fixOpen" type="button">內容需要修改</button>
        <div id="fixBox" hidden style="display:grid;gap:10px">
          <textarea id="fixNote" placeholder="請寫下要修改的地方，例如：女方家地址改成…、出發時間改成…"></textarea>
          <div class="err" id="fixErr"></div>
          <button class="go" id="fixGo" type="button">送出修改需求</button>
        </div>
        <p class="prev" id="prevOk" hidden></p>
      </div>
    </div>
  </div>

  <div id="done" class="done" hidden>
    <div class="ck" aria-hidden="true">✓</div>
    <h2 id="dTitle">已確認，謝謝你們！</h2>
    <div class="pill" id="dPay"></div>
    <p id="dText"></p>
    <a class="line" href="https://line.me/R/ti/p/@niceweddingcar">完成，返回 LINE</a>
  </div>
</div>
<script>
(function(){
  var BOT = 'https://script.google.com/macros/s/AKfycbwoKk13j5YOtkA5cTh3FtvECekYm0uMBPsid1H--kB7bhUVpDFvSnSA0iTzCfc8IT11_Q/exec';
  var $ = function(id){ return document.getElementById(id); };
  var Q = new URLSearchParams(location.search), no = (Q.get('no') || '').trim(), k = (Q.get('k') || '').trim(), DEMO = Q.get('demo') === '1';
  var J = null, pay = '';
  function post(body){ return fetch(BOT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(function(r){ return r.json(); }); }
  function money(n){ return '$' + Math.round(+n || 0).toLocaleString('en-US'); }
  function bad(t){ $('loading').hidden = true; $('bad').hidden = false; $('bad').textContent = t; }
  function md(d){ var m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[1] + '/' + (+m[2]) + '/' + (+m[3]) : ''; }
  function tm(t){ var d = new Date(+t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function payTxt(p, bal){ return p === 'cash' ? '尾款：用車當天付現金 ' + money(bal) : p === 'transfer' ? '尾款：提前匯款 ' + money(bal) + '（最晚用車前一天）' : '月結，不用支付尾款'; }
  function setPay(p){ pay = p; Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b){ b.setAttribute('aria-pressed', b.dataset.pay === p ? 'true' : 'false'); }); }
  function show(j){
    J = j; $('loading').hidden = true; $('main').hidden = false;
    $('head').textContent = '訂單編號：' + j.no + (j.date ? '｜用車日期：' + md(j.date) : '') + (j.couple ? '\n' + j.couple : '');
    $('memo').textContent = j.text || '';
    if (j.mon) $('payBox').hidden = true;
    $('amtCash').textContent = money(j.bal) + '（尾款＋司機禮）'; $('amtXfer').textContent = money(j.bal);
    if (j.ok){ setPay(j.ok.pay === 'none' ? '' : j.ok.pay); $('okChk').checked = true; $('prevOk').hidden = false; $('prevOk').textContent = '你已於 ' + tm(j.ok.at) + ' 確認過（' + payTxt(j.ok.pay, j.bal) + '），如需更改付款方式可以重新送出。'; }
  }
  function done(kind){
    $('main').hidden = true; $('done').hidden = false; window.scrollTo(0, 0);
    if (kind === 'fix'){ $('dTitle').textContent = '已收到修改需求'; $('dPay').hidden = true; $('dText').textContent = '我們會儘快更新確認單，再傳給你們核對一次。'; return; }
    $('dPay').textContent = payTxt(J.mon ? 'none' : pay, J.bal);
    $('dText').textContent = pay === 'cash' ? '當天請把尾款＋司機禮包成一包，交給車隊負責人就好。' : pay === 'transfer' ? '請在用車前一天以前完成匯款。\n因會計無法即時對帳，請勿於用車當天匯款，謝謝！' : '期待陪你們迎接美好的一天。';
  }
  Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b){ b.onclick = function(){ setPay(b.dataset.pay); $('err').textContent = ''; }; });
  $('go').onclick = function(){
    $('err').textContent = '';
    if (!J.mon && !pay){ $('err').textContent = '請選擇尾款付款方式'; return; }
    if (!$('okChk').checked){ $('err').textContent = '請先核對內容，並勾選「皆正確無誤」'; return; }
    if (DEMO) return done('ok');
    var b = this; b.disabled = true; b.textContent = '送出中…';
    post({ action: 'wedMemo', op: 'submit', no: no, k: k, pay: pay }).then(function(r){ if (!r || !r.ok) throw new Error((r && r.error) || '送出失敗'); done('ok'); })
      .catch(function(e){ $('err').textContent = e.message || '送出失敗，請再試一次'; b.disabled = false; b.textContent = '確認送出'; });
  };
  $('fixOpen').onclick = function(){ var x = $('fixBox'); x.hidden = !x.hidden; if (!x.hidden) $('fixNote').focus(); };
  $('fixGo').onclick = function(){
    var note = $('fixNote').value.trim(); $('fixErr').textContent = '';
    if (!note){ $('fixErr').textContent = '請寫下要修改的地方'; return; }
    if (DEMO) return done('fix');
    var b = this; b.disabled = true;
    post({ action: 'wedMemo', op: 'fix', no: no, k: k, note: note }).then(function(r){ if (!r || !r.ok) throw new Error((r && r.error) || '送出失敗'); done('fix'); })
      .catch(function(e){ $('fixErr').textContent = e.message || '送出失敗，請再試一次'; b.disabled = false; });
  };
  if (DEMO) return show({ no: '20261025ML01', date: '2026-10-25', couple: '新郎 & 新娘', bal: 53500, mon: false, ok: null,
    text: '好好禮車           訂單編號:20261025ML01\nWedding Day 2026/10/25（日）\n———————\n用車時間：08:15 - 11:15\n集合：07:55\n聯絡人：王小美 0912-xxx-xxx\n\n方案\nRolls-Royce Phantom 幻影 ×1、Tesla Model X ×5\n\n主禮車｜REA-xxxx｜司機｜Rolls-Royce Phantom 白色\n\nA. 男方家\n苗栗縣公館鄉仁安村仁安118-2號\nB. 女方家\n苗栗市文發路422巷16號\n\n付款：\n尾款 $53,500(含司機禮)\n(請勿當天用車結束才匯款，假日會計無法即時查帳)\n❤️匯款資訊：\n（範例）' });
  if (!no || !k) return bad('連結不完整，請回到 LINE 重新點一次按鈕。');
  post({ action: 'wedMemo', op: 'load', no: no, k: k }).then(function(j){ if (!j || !j.ok) throw new Error((j && j.error) || '讀取失敗'); show(j); })
    .catch(function(e){ bad(e.message || '讀取失敗，請回到 LINE 告訴我們。'); });
})();
</script>
</body>
</html>
